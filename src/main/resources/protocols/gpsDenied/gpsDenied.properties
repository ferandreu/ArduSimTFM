# GpsDenied protocol parameters
# These values are the defaults shown in the GUI and used in CLI mode.

# Leader starting position
latitude=39.482594
longitude=-0.346265

# Heading the leader flies: 0 = North, 90 = East, 180 = South, 270 = West (degrees)
yaw=0.0

# (X) Straight-line distance the leader travels (metres)
leaderFlightDistance=2000.0

# (Y) Perpendicular distance of observer drones from the leader path (metres)
observerSideDistance=400.0

# Cruise altitude for all UAVs (metres, relative to takeoff point)
altitude=20.0

# Leader cruise speed (m/s)
leaderSpeed=10.0

# Circle radius used for the geometric intersection algorithm (metres).
# Should be close to the actual communication range.
estimationRadius=1000.0
