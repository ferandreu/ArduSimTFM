# GpsDenied protocol parameters
# These values are the defaults shown in the GUI and used in CLI mode.

# Leader starting position
latitude=39.482594
longitude=-0.346265

# Heading the leader flies: 0 = North, 90 = East, 180 = South, 270 = West (degrees)
yaw=0.0

# (X) Straight-line distance the leader travels (metres)
leaderFlightDistance=1200.0

# (Y) Perpendicular distance of observer drones from the leader path (metres)
observerSideDistance=700.0

# Cruise altitude for all UAVs (metres, relative to takeoff point)
altitude=20.0

# Leader cruise speed (m/s)
leaderSpeed=10.0

# Optional intermediate waypoint — creates a bent route visible on the map.
# midpointAlong: distance along the heading from the start (metres). 0 = straight line.
# midpointRight: perpendicular offset (metres). Positive = right, negative = left.
# Example (veer 300 m right halfway through a 2000 m route):
#   midpointAlong=1000.0
#   midpointRight=300.0
midpointAlong=400.0
midpointRight=-300.0
